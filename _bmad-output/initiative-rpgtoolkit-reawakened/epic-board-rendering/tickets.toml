# tickets.toml — UNAPPROVED DRAFT of the planned entries of epic-board-rendering, in build order.
# Built 2026-10-12 against this worktree's main (3ec2ab9). Sources: epic-board-rendering.md; the architecture
# spine (AD-1 to AD-4, AD-10, AD-15 to AD-17, AD-26 to AD-29, AD-32, AD-33 and the Deferred list);
# docs/engine-features.md E-01..E-06, E-10..E-19, E-50..E-63; docs/format-spec.md sections 3, 4, 5, 7.1, 9.11;
# the epic 1, 2 and 3 tickets.toml; deferred-work.md; spec CAP-2 and CAP-6.
# Assumptions A1..A14 and the open questions the user must rule are listed in discovery/inception-proposal.md
# and echoed in the epic's Notes. The order of the tables is the build order. A provider in another epic is
# pinned as <epic id>.<entry id>.
# Entries 21 and 22 were added at the inception review and stand first in build order: 21 is the doc-first
# rulings entry every render-lane entry consumes, and 22 is the shared fixture set the corpus cannot supply.
# An id names an entry for good and is not an order; the order of the tables is the build order.

[[entry]]
id = 21
type = "story"
title = "Render-lane rulings and the epic-3 interface pins (doc-first)"
description = "The epic's first step, doc-first under G7 in its own commits: a person rules every under-specified rule the render lane depends on, from the discovery's render-readiness audit — the iso2d resampling filter, sampling grid and diamond clip; the iso draw traversal order for stacked and rotated boards and the sprite z-order tie-breaker; under-vector promotion geometry and how it combines with E-31's sprite translucency; the multi-layer shade combination, the light bake formulas and the ambient application boundary; the parallax degenerate cases and background tiling; the debug overlay flags and colours; the message-window geometry, font defaults, wrap, reveal units and overflow; the modal widget signatures and layout; the screen save and restore slot rules; the canvas signatures and renderNow's binding; the transition durations, easing and earthquake decay; the camera deadzone, smoothing constants, easing curves and small-board border; viewBrd's coordinate semantics; the .tan fallbacks; animation completion and sizedAnimation's arguments; board constants against the board's unnamed array; put and layerPut coordinates and redraw timing; text defaults and cell-unit alignment; native alpha against blit alpha; and the send visual cutover — amending docs/format-spec.md and docs/engine-features.md; the +8 px iso sprite offset being an editor-display rule or a runtime one; and amends the spine for the four cross-epic contracts epic rpgcode-vm's entries 3.2, 3.7, 3.8, 3.9 and 3.25 must code against, each landed in the AD that owns it: the waits and threads phase-handler signatures and how a module registers into the phase list (AD-26), the GameState section-typing and replacement rule against 3.2's placeholder aliases (AD-10), the harness request and reply seam the driver needs once an engine emits asset requests (AD-1 and AD-5), the call the lifecycle makes to load a program and start a thread (AD-5 and AD-8), and the rendering pack's place in the default manifest's order (ADR 0004 decision 6, which entry 3.25 cites)."
verify = "A person approves a commit set that touches only docs/, the spine's AD amendments and the affected plan notes; every finding in discovery/render-readiness.md is ruled or explicitly deferred with the entry it affects named; and the spine names the phase-handler signature and the registration seam, the GameState section replacement rule, the harness reply seam, the program-loading and thread-starting call, and the rendering pack's manifest place, each in the AD that owns it; the two answers 3.2's draft plan already chose are corrected in its plan."
covers = ["CAP-2", "CAP-6"]
after = ["3.26"]
hitl = true
risk = "high"
plan_checkpoint = true
references = [
  "discovery - _bmad-output/initiative-rpgtoolkit-reawakened/epic-board-rendering/discovery/render-readiness.md (the audit, its findings and the entry each blocks)",
  "spine - architecture-rpgtoolkit-reawakened.md, AD-1, AD-2, AD-3, AD-5, AD-7, AD-8, AD-10, AD-15, AD-25 to AD-28, AD-33",
  "handoff - epic tk2-support entry 16.3 writes the format-spec §3.5 text; where it does, its text governs the file format and this entry rules only the render-side fallbacks",
  "reference - docs/guardrails.md, section G7 (fix the doc first, in its own commit)",
  "handoff - the pins land in the ADs named in the description, and epic rpgcode-vm's entries cite the spine they build on (3.2 AD-1, AD-7, AD-10 and AD-26; 3.7 AD-24 plus the harness seam this entry lands in AD-1 and AD-5; 3.8 AD-5 and AD-7; 3.9 AD-9 and AD-26; 3.25 ADR 0004), so their builders read the ruling; where 3.2's draft plan has already chosen an answer (its Q3 placeholder aliases and Q6 advanceScriptStep), the ruling supersedes it and the plan is corrected in this entry's commit set",
  "sequencing - run this entry before epic rpgcode-vm's 3.2, in the same moment 3.26 lands: the initiative's order puts epic 3 first, so this is a wall-clock ordering gate and not an after edge, and 3.2's builder must not start until this entry has landed the pins (otherwise a pin that contradicts 3.2's own plan choice means rewriting code rather than correcting the plan)",
  "note - the tick names are 3.26's own spine amendment, not this entry's; the core/time rounding rule belongs to 3.9 and the command.overridden warning to 3.3",
  "assumption A1 - the golden-image reference is this renderer's reviewed output; see the epic Notes",
]

