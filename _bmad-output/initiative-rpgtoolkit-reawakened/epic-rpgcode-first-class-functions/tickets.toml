# Extends RPGCode with first-class function values, dynamic invocation, and global symbol reassignment.

[[entry]]
id = 1
type = "story"
title = "Rulings: Function handles, address-of syntax, invocation, and environment table"
description = "Doc-first (G7), docs only: amends RPGCode language specification and ADR-0004 to define first-class function values (`FunctionValue` in `Value`), the address-of operator `&fn`, dynamic invocation syntax `f(args)`, global symbol reassignment for command overriding, and the unification of the 4-tier resolution pipeline into a single deterministic environment table with transparent built-in fallback."
verify = "The commit touches only docs and affected specification/ADR files; each syntax and semantics decision carries an OWNER marker, evidence, and a rejected alternative; no implementation entry relies on unruled language syntax; a person approves the checkpoint."
covers = ["CAP-5"]
after = ["3.3", "3.27"]
hitl = true
risk = "high"
plan_checkpoint = true
done_checkpoint = true
references = [
  "spec - docs/spec/engine/rpgcode-language.md (FUN-1, FUN-5, R-35)",
