# tickets.toml — planned entries of epic-battle, in build order. tickets.py reads it.
# Table order is the build order; ids are stable names. Entry 1 is an owner-approval docs checkpoint (pending).
# Lanes: A docs/state (1, 2), B API (3), C package rules (4-8), D starts and media (9, 10), E UI and custom-program proof (11, 12); 13 reconciles seams and closes the epic.
# The 2026-10-19 owner re-slice: core owns actor data and the battle section (fighter references and charge), the stock-battle RPGCode package owns the loop, rules, AI and UI.

[[entry]]
id = 1
type = "story"
title = "Rulings: the battle package boundary, battle state, the facing API and the defeated event"
description = "Doc-first (G7), docs only: writes docs/spec/engine/battle.md (BAT-1 to BAT-15) to settle the battle package boundary (the core owns the `battle` section with fighter references and charge, plus the actor model; the `stock-battle` package owns the loop, charge rate, damage, status round effects, AI, outcomes sequence, music cues and UI), the `BattleSection` shape (active battle id, parties of actor references plus charge, background, canRun, outcome 0-4; never copies HP, SMP or status effects), the rebuild mapping of E-79's callbacks 114-132 to actor methods and battle operations (no core `fightTick`), the `defeated` event, R-57 (random start charge, +3 plus or minus 2 per speed/slow, 75/123, `skill` always -1, damage variance and criticals), R-16 (one `experienceIncrease` rule), R-11 (`.spc` flags), outcomes 0-4, the no-enemies message, battle music, the party source, and that the default UI uses existing 3.1 draw primitives. Amends E-72 to E-79 and E-77's outcome wording, EMIT-13's `defeated` row and AD-10's `battle` row; records a rejected alternative for each owner choice."
verify = "The commit touches only docs and affected spec/spine text; every BAT row has an OWNER marker, evidence and a rejected alternative; the `battle` section is ruled to hold fighter references and charge only, with status effects on actors, and AD-10 matches; E-79's 114-132 map to named rebuild operations with none left unruled; R-57, R-16 and R-11 each have one rule; outcomes 0-4 and the no-enemies message are ruled; a person approves the checkpoint."
covers = ["CAP-9"]
after = ["5.11", "19.11", "20.1", "20.2", "20.6", "21.1"]
hitl = true
risk = "high"
plan_checkpoint = true
done_checkpoint = true
references = [
  "spec - docs/spec/engine/plugins-and-battle.md#e-70 to E-79",
  "spec - docs/spec/formats/battle-data.md (.bkg, .ste, .spc)",
