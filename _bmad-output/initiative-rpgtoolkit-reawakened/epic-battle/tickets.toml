description = "Implements E-76 enemy AI in the stock package: the four built-in levels as the table states (random target with a 50/50 physical or special choice, special moves until SMP runs out, weakest target with a 50/50 choice, weakest target with specials first), a deterministic index tie-break for weakest, affordability checks, curative specials choosing the lowest-HP ally, and a custom `useCode` AI program run with `source` as the enemy and `target` as the drawn player; the `ai(level)` built-in sets the acting enemy's level."
