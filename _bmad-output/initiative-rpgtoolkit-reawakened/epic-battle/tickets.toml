description = "Implements the player's Fight, Special Move and Item actions and E-74 damage inside the stock package: one seeded variance draw for damage (`FP` with a plus or minus 10% variance, rounded by the ruled integer rule), `DP` subtracted unless `giveCrit`/`takeCrit` makes a critical that bypasses it, a minimum of 1, damage to HP or SMP, special-move FP and SMP drain and SMP cost with affordability, the move's animation and status, item fight HP/SMP through an inventory port with a test double and a posted consume effect, and `attackall`/`drainall` without criticals; damage goes through the actor method so `fallen` fires once."
