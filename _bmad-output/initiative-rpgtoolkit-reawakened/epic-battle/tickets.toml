[[entry]]
id = 4
type = "story"
title = "Charge-bar turns: the ATB loop"
description = "Implements the stock battle package's charge-bar loop: initialise each fighter's charge from the seeded shared RNG, add its effective speed (3, plus 2 per active speed effect, minus 2 per active slow effect, floored at zero) each whole engine tick (a `threadSleep` of 1/60 second, which the ruled conversion turns into one tick), freeze a disabled fighter, let a player act when charge reaches 75 and an enemy when it reaches 123, reset the acting fighter's charge on release, and drive the loop from the package's `battle` command, with deterministic turn order (enemies before players, then party index)."
verify = "Seeded runs reproduce the initial charges and the charge timeline; speed, slow, disable and multiple effects change the rate exactly as ruled; players act at 75 and enemies at 123; release resets; a save/restore or replay produces the same turn order; the loop consumes whole ticks and no wall clock, `Date` or `Math.random`."
covers = ["CAP-9"]
after = [3, "20.11"]
hitl = false
risk = "high"
references = [
  "spec - docs/spec/engine/battle.md as ruled by 7.1 (BAT-4)",
  "spec - docs/spec/engine/plugins-and-battle.md#e-72",
  "code - packages/core/src/ports/wait.ts, packages/core/src/script/waits.ts",
]

