description = "Extends docs/format-spec.md, in its own commit (G7), with the text layouts of .brd, .gam, .itm and .tem, the corrected .gam 2.2 and .tem 3 to 4 branches, the verified .anm, .ene, .spc, .ste and .bkg text forms, the .tan, .gph v2 and new .fnt sections, and the TST 8-bit detail palette from the official 2.0 tileset spec; each section cites its evidence and the question it answers."
verify = "Every new or changed section cites its archive evidence path and file count or its entry 2 answer, and the four previously undocumented text layouts have a worked example checked against at least two games."
covers = ["CAP-1"]
after = [1, 2]
hitl = true
risk = "medium"
plan_checkpoint = true
done_checkpoint = true
