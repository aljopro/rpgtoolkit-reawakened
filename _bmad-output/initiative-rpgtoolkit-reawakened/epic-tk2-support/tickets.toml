# tickets.toml — planned entries of epic-tk2-support, in build order. tickets.py reads it.

[[entry]]
id = 1
type = "story"
title = "Write the extraction question list"
description = "Writes the numbered question list (ADR 0006 is Accepted): every TK2 layout or rule that the archive evidence and the allowed data files cannot answer (text .brd, .gam, .itm, .tem; the .gam 2.2 and .tem 3 to 4 field sets; .fnt; the 3.x update wizard conversion rules). Questions the data can answer are listed as derived, not asked."
verify = "The question list is numbered, each question names the evidence that could not answer it, and a person approved it."
covers = ["CAP-1"]
after = []
hitl = true
risk = "medium"
plan_checkpoint = true
done_checkpoint = true
references = ["adr - docs/adr/0006-clean-room-spec-extraction.md", "research - _bmad-output/initiative-rpgtoolkit-reawakened/epic-tk2-support/discovery/tk2-formats-research.md, Unknowns"]
[[entry]]
id = 2
type = "story"
title = "Extraction round: answer the question list from the legacy source"
description = "A disposable extractor subagent, which never writes code for this epic, reads the legacy source only to answer entry 1 questions and writes prose facts (layouts, tables, rules in its own words) to a staging file; a second, separate agent session reviews it for copied expression and reports its findings, and the assistant writes the audit entry and tells the user. May close with no source read if entry 1 lists no questions."
verify = "The reviewed staging file answers every listed question in prose with no code, identifiers or comments from the source, the reviewer found no copied expression, and the round is recorded in docs/provenance/extraction-log.md with source revision, date, extractor and reviewer."
covers = ["CAP-1"]
after = [1]
hitl = true
risk = "high"
plan_checkpoint = true
done_checkpoint = true
