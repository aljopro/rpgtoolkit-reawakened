# tickets.toml — planned entries of epic-audio-synth, in build order. tickets.py reads it.
# Table order is the build order; ids are stable names. Entries 1 to 3 are owner-approval docs checkpoints (pending).
# The audio timeline oracle is authored from docs/spec and rulings; it is not a legacy-parity claim and holds no hashes.
# Shared-seam owners: 6 owns the `audio` section type and the `core/audio` barrel, 7 adds voice, fade and sync
# behaviour without changing the type, 8 owns the control pack, `mediaVolume`, the audio read view and the `audio.track`
# wait, 9 owns the query pack and legacy mapping, 10 owns the video pack, and 17 performs the final catalogue, barrel
# and stub-removal reconciliation. The Audio table and catalogue rows are edited only by 8, 9 and 10, each for its names.

[[entry]]
id = 1
type = "story"
title = "Core audio rulings: tracks, time, cues and waits"
description = "Doc-first (G7), docs only: creates `docs/spec/engine/audio-media.md` with the core audio rules and amends AD-16, AD-9 and AD-14 to settle the track-and-voice `GameState.audio` schema with the saved-state versus settings split (volumes are settings; script-set volume versus the player's mix is ruled here), music after load, the tick time model (end tick from asset length, catch-up for late starts, rounding, `audio.ended` demoted to advisory), generic per-track cues with a single `media.fade` cue, the `audio.track` wait with suspend-on-pause wake rules, and how Epic 4's `music.play` and `sfx.play` effect records map onto the `music` and `sfx` tracks, including which side decides same-file and silence at board entry (the applier, not `engine.musicAsset`) and where the `music` virtual variable (Q19) now reads from."
verify = "The commit changes only docs and the affected spine rows; each work-package rule P1, P2, P4 and P5 has an OWNER marker, evidence, a rejected alternative and a deterministic rule; the AD-9, AD-14 and AD-16 amendments name every producer, validator, port type, virtual variable and fixture they change; no later entry relies on an unruled audio observable; a person approves the checkpoint."
covers = ["CAP-7"]
after = ["3.9", "3.27", "4.29"]
hitl = true
risk = "high"
plan_checkpoint = true
done_checkpoint = true
