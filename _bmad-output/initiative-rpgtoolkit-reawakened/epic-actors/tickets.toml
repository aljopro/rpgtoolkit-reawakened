[[entry]]
id = 6
type = "story"
title = "Core interpretation rules: fallen, status countdown, equipment bonuses, level-up"
description = "Implements the core defaults ruled in 20.1: an actor is fallen when HP <= 0 unless a behaviour says otherwise (fallen is a state, never a removal: the actor stays in the party, and revival is the state changing back by HP being raised or a behaviour-defined revive, firing `fallen` and `revived` events), status effects count down through `advanceStatus(n)` with the battle script choosing when a round passes, equipment bonuses apply from item data, and level-up default derives from character data; each is a hook with a core default. Level and experience are stats; the level-up default is the equation ruled in 20.1 (a standard equation defined in code, overridable by behaviours)."
verify = "Fallen (a state, never a removal; revival changes it back), countdown, equipment and level-up (the 20.1 default equation, with level and experience as stats) produce the ruled results from fixture data with no battle script present; `advanceStatus(2)` ages every status by 2 and expires at zero emitting the ruled change; two different 'round' definitions (per turn, per time) drive the same counters in a test."
covers = ["CAP-9", "CAP-10"]
after = [5]
hitl = false
risk = "high"
references = [
  "spec - docs/spec/engine/actors.md (ACT rows from 20.1)",
  "spec - docs/spec/engine/plugins-and-battle.md#e-75, E-77, E-78 (data only; the 'each round while charged' rule is stock-battle)",
  "code - packages/core/src/actors/ (from 20.3)",
]

