# tickets.toml — planned entries of epic-actors, in build order. tickets.py reads it.
# Table order is the build order; ids are stable names. Entry 1 is an owner-approval docs checkpoint (pending); entry 2 is the actor model inventory every later entry reads.
# Lanes: A core/actors (3, 5, 6, 7, 8, 10; 3 owns the barrel and section), B script bindings (4), C packages and .gam (11, 12).
# The core/battle boundary of the 2026-10-19 owner decisions: core owns actor data and defaults, packages own battle systems.

[[entry]]
id = 1
type = "story"
title = "Rulings: actor boundary, behaviours, save rule and hydration"
description = "Doc-first (G7), docs only: settles in docs/spec the core-versus-battle boundary (core owns actor data and the interpretation rules true for any game; the stock battle package owns ATB, damage, AI and UI), the behaviour pattern (data gives the default, a behaviour overrides it), the save rule (data and a behaviour name, never callables), hydration by name with a diagnostic on a missing behaviour, and how actors own stats and legacy stat globals alias them (amending AD-10 and removing StatsPort's vm.globals-owner wording) and AD-32's Unified Actor."
verify = "The commit touches only docs and affected spec/spine text; the AD-26 `battle` phase is ruled removed/repurposed (battle is a package) and amended in the spine; a default level-up equation is ruled (level and experience are stats; abilities are standard equations with defaults, overridable by behaviours); each ruling row has an OWNER marker, evidence and a rejected alternative; the owner's 2026-10-19 boundary, save and legacy decisions each map to one ruled row; AD-10 is amended (actors own stats; legacy `.tem` globals are live read/write aliases; StatsPort's \"vm.globals owner\" wording removed) with the costs recorded (golden re-record G5, reset clears the actor section, `kill()` on an alias resets to the .tem default); the 19.2 spike result is applied; a person approves the checkpoint."
covers = ["CAP-3", "CAP-9", "CAP-10", "CAP-11"]
after = ["19.1", "19.2"]
hitl = true
risk = "high"
plan_checkpoint = true
done_checkpoint = true
references = [
  "spec - docs/spec/engine/plugins-and-battle.md#e-79 and E-72 to E-78, E-85",
  "spec - docs/spec/formats/character.md, enemy.md, item.md, battle-data.md",
  "spine - _bmad-output/initiative-rpgtoolkit-reawakened/architecture-rpgtoolkit-reawakened/architecture-rpgtoolkit-reawakened.md, AD-10, AD-26, AD-32",
  "discovery - _bmad-output/initiative-rpgtoolkit-reawakened/epic-battle/discovery/all-rpgcode-battle-architecture.md (narrower reading superseded)",
  "discovery - _bmad-output/initiative-rpgtoolkit-reawakened/epic-rpgcode-platform/discovery/step-budget-spike.md",
]

