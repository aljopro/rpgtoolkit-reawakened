[[entry]]
id = 4
type = "story"
title = "Actors as RPGCode objects with emitters"
description = "Exposes each actor to RPGCode as an object and adds the write path to the virtual-variable port (`script/virtuals.ts`, read-only today) so legacy `.tem` stat globals (`HP!`, `Level!`) are live read/write aliases of the actor stat, with `kill()` on an alias a located diagnostic and no-op (system-controlled names are never killed) and writes never breaking the link: stat reads and writes that go through the owner, `advanceStatus` and the other core operations as methods, and the actor as a built-in emitter using the entries 19.4 and 19.10 machinery."
verify = "A script reads and writes actor stats and calls the core operations through the object; writes go through the owner and are visible in the actor section; `actor.on(...)` registers a listener on that actor; writing `HP!` through the alias changes the actor stat and reading it returns the actor stat, with no copy; `kill()` on the alias gives a located diagnostic, changes nothing, and the link still works afterwards; no callable is stored in the actor section."
covers = ["CAP-5", "CAP-9"]
after = [3, "19.4", "19.10"]
hitl = false
risk = "high"
references = [
  "spec - docs/spec/engine/actors.md",
  "spec - docs/spec/engine/rpgcode-modules-and-objects.md (OOP-10, OOP-11)",
  "code - packages/core/src/script/builtins/",
]

