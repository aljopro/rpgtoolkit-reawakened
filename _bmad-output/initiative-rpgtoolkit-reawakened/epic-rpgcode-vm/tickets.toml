[[entry]]
id = 15
type = "story"
title = "TK2 dialect frontend, command coverage and the TK2 compatibility plugin"
description = "Adds a non-destructive TK2 grammar frontend (`{ }` blocks, `#` as statement introducer including `#x! = 1` assignments, labels with #Branch and #FBranch, #Method and #ReturnMethod, namespace includes, `=` as comparison) that emits raw argument text and lets lowering bind it through each command's `ParamSpec`, mapping TK2 commands onto the same `commands` as TK3: 141 of 301 observed commands already have a 3.1 name, 2 are compat-only (#Empty, #FBranch), 39 are unmapped plugin or library names, and 119 are user-defined #Method commands; signature adapters (#SetImage 5-arg, #WalkSpeed and #ItemWalkSpeed string to number, #NewPlyr to newPlayer) live in `@tk-reawakened/plugin-tk2-compat`, a `PluginDefinition` from entry 3. TK 1.x (RPGCode v1, the `< >` inline-block form) is out of the MVP by decision. Of the 39 unmapped TK2 commands, 24 are plugin commands (FTP.dll: #httpRead and #ftp*; filereadwrite.dll: #fileRead; GsMiscPlugins.dll, proplug.dll, TWButton, XFMWin, multip.dll), 11 are implicit-include libraries, 1 is the `system.*` namespace and 3 are undocumented (addplyr, cntrtext, sell); each plugin command answers through a recorded-effect stub in the compat plugin with a failure default and no real network or file access (AD-17) until E-99 decides real behaviour."
verify = "Every command in the TK2 coverage matrix is mapped to a built-in, supplied by the compat plugin, answered by the extension tier with a located diagnostic, or listed unsupported with its program count; a synthetic TK2 program and the TK2 programs of the archived games lower to the same AST shapes as their TK3 equivalents."
