[[entry]]
id = 8
type = "story"
title = "Modules: includes, implicit includes, redirects, hoisting, program cache"
description = "First step, doc-first (G7): a person rules MOD-2 and MOD-3 from the discovery's ambiguity list in `docs/format-spec.md` in its own commit. Implements `#include` and `include()`, implicit include `file.func(args)`, `redirect`/`killRedirect`/`killAllRedirects` with their `redirects` state section, per-file hoisting and visibility after include, `Prg/` path resolution through the epic-2 asset resolver, `ProgramCache` keyed by `sourceHash` (E-91), and the refusal of a pre-compiled `.prg` (first byte `0x00`) with the section 9.1 message. Function names clash across files in real code (two queue and stack libraries both define AddLit and PopLit, told apart only by the `file.` prefix), and the unqualified-after-first-use rule is claimed by one community tutorial but not seen across files, so this entry's doc-first ruling decides it. A script function replaced by a later include or definition raises a `command.overridden` warn record and a located `StepReport` diagnostic { code, file, line, message } so script authors and handlers can see it."
verify = "An include cycle, an implicit include and a redirect chain each resolve as documented, a cached program is not re-parsed, and a `.prg` whose first byte is `0x00` is refused with the section 9.1 message."
covers = ["CAP-5"]
after = [7, "2.10"]
hitl = true
risk = "medium"
references = [
  "reference - docs/format-spec.md, sections 9.1, 9.6",
  "reference - docs/engine-features.md, E-91",
  "spine - _bmad-output/initiative-rpgtoolkit-reawakened/architecture-rpgtoolkit-reawakened/architecture-rpgtoolkit-reawakened.md, AD-5, AD-7",
  "provider - epic-legacy-formats entry 2.10 (asset resolver and package loader)",
]
plan_checkpoint = true
notes = ["#Include gives access to that file's functions under a namespace-like structure, a nested function name. (Jensen, 2026-10-11)", "Working rule until evidence says otherwise: #Include, an implicit file.func call and first run each add the file's functions to one flat command list at that moment, a later definition replaces an earlier one with the same name, and the file. prefix always reaches that file's own definition. (Jensen, 2026-10-11)"]

