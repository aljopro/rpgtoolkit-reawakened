[[entry]]
id = 3
type = "story"
title = "PluginDefinition (commands only) and the built-in registry assembly"
description = "Defines `PluginDefinition` as `{ id, version, commands }` (ADR 0004 decision 2), where a command is an AD-8 `BuiltinSpec` with a functional contract: `(read-only view, args) -> { out, effects, wait? }`; commands never mutate state and the VM and owning modules apply their effects (amends AD-8 and AD-10 doc-first, including its duplicate rule). Adds a pure assembly function over it: fixed module order, last-registered-wins for a repeated name or alias with a warning diagnostic (replacing AD-8's duplicate rejection, which stays only as a lint for one plugin repeating itself), by-reference `out` write-back sharing the call and lvalue machinery entry 2 built, and the four-tier lookup skeleton (redirect, script function, built-in, empty extension tier). Replaces the tracer's provisional registry. Other fields (`subsystems`, `decoders`, a dialect hook) are added by the entry that first needs them; not `createEngine`, which epic 4 owns (D12). The override warning goes through the AD-24 `Logger` port, which this entry defines minimally (levels and plain-data records) and entry 7 extends: a warn record with code `command.overridden` and data { name, kind (plugin or script), previous, replacement }."
verify = "The assembly function lets the later of two `PluginDefinition`s win a repeated name or alias and emits one warning diagnostic naming both, a fixture command's `out` writes the caller's variable back, a command run twice on the same view and args returns equal results and leaves the view unchanged, stub tiers resolve in the documented order, and ADR 0004, AD-8 and AD-10 state the functional contract. and one `command.overridden` warn record per replaced name reaches the `Logger` port"
covers = ["CAP-5"]
after = [2]
hitl = true
risk = "medium"
references = [
  "spine - _bmad-output/initiative-rpgtoolkit-reawakened/architecture-rpgtoolkit-reawakened/architecture-rpgtoolkit-reawakened.md, AD-8 (assembly, duplicate rejection, precedence), AD-10 (vm section ownership)",
  "adr - docs/adr/0004-script-ast-step-ir-and-plugins.md, decision 2 (dogfooded standard library)",
  "reference - docs/format-spec.md, section 9.11",
  "contract - packages/core/src/ports/engine.ts, line 4 (createEngine deferred to the engine epic; epic 4 owns it)",
]
plan_checkpoint = true

