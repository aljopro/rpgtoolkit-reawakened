# tickets.toml — the planned entries of this epic, in build order. tickets.py reads it.

[[entry]]
id = 1
type = "story"
title = "Binary read and write primitives"
description = "Adds pure, deterministic little-endian binary reader and writer utilities in `core/formats/binary` for i8, u8, i16, u16, i32, u32, f64, NUL-terminated Windows-1252 strings, COLORREF, and upper-bound array loops per format-spec section 1. Built with zero Node or DOM dependencies (G2), deterministic maths (G3)."
verify = "Unit tests with synthetic byte buffers prove exact round-trip serialization and error handling for EOF/bounds."
covers = ["CAP-1"]
after = []
hitl = false
risk = "low"

[[entry]]
id = 2
type = "story"
title = "Tileset (.tst) reader and writer"
description = "Adds reader and writer for Toolkit tileset files (.tst) supporting version 20 (24-bit column-major RGB pixels) and version 30, with true-count handling per format-spec section 3.1. Adds transparent key detection (0,1,2)."
verify = "Both sample tilesets in demo and Basic (char.tst, default.tst) parse without trailing bytes; writer produces identical bytes on round-trip."
covers = ["CAP-1"]
after = [1]
hitl = false
risk = "low"

[[entry]]
id = 3
type = "story"
title = "Texture decoders: PNG and JPEG"
description = "Adds `core/format/image` with `decodeTexture` (AD-28), returning pure RGBA Uint8Array. Decodes 8-bit palette Adam7 PNG (using fflate/browser unzlibSync for deflate decompression, manual filter and palette expansion) and baseline 4:2:0 JPEG (evaluating jpeg-js with useTArray: true vs integer baseline decoder per G2/G3)."
verify = "Both fixture JPEGs (bkg.jpg, mwin.jpg) and layout.png decode to exact expected dimensions and RGBA buffers; deterministic across runners."
covers = ["CAP-1"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Animation (.anm) reader and writer"
description = "Adds reader and writer for animation files (.anm), parsing major 2 / minor 3 binary format per format-spec section 7.1: 51 frame slots, tile references (set.tstN), frame transparent color, audio cues, and frame delay seconds."
verify = "All 26 sample .anm files in demo and Basic parse with 0 trailing bytes; round-trip serialization matches."
covers = ["CAP-1"]
after = [1]
hitl = false
risk = "low"

