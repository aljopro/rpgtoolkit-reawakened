[[entry]]
id = 11
type = "story"
title = "Cancelable emit: parked dispatch, cancel and event mutation"
description = "Implements the opt-in cancelable emit: the emitting thread parks on a plain-data `event.dispatch` wait until every listener ran in registration order, then resumes with the event object; listeners may `cancel()` or change fields (a shield halves damage); a save taken mid-dispatch restores and finishes identically."
verify = "A cancelable emit with listeners that modify and cancel gives the ruled result to the emitter; a save at every tick during dispatch restores to the same final hash; a plain emit never blocks; step cost matches the 19.2 measurement within its stated headroom."
covers = ["CAP-5", "CAP-11"]
after = [10]
hitl = false
risk = "high"
references = [
  "spec - emitter section written by 19.1",
  "spine - AD-9 (wait kinds are owner-namespaced)",
  "code - packages/core/src/script/waits.ts",
  "spike - epic-rpgcode-platform/discovery/step-budget-spike.md",
