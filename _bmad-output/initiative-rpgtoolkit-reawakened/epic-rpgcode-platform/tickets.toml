[[entry]]
id = 4
type = "story"
title = "Receiver auto-binding, this and bindThis"
description = "Implements `OP_GET_MEMBER_BOUND`: reading a callable member binds `CallableValue.receiver` to the object, tear-offs keep it, standalone lambdas have `this = null`, and the built-in `bindThis(fn, obj)` returns a rebound callable; `this` resolves from the receiver."
verify = "`cb = obj.method; cb()` runs with `this = obj`; a standalone lambda sees `this` as null; `bindThis(fn, other)` gives a new callable with the new receiver and leaves `fn` unchanged; the receiver survives save/restore and keeps its object alive; `bindThis` has a command-catalogue row and command doc."
covers = ["CAP-5"]
after = [3]
hitl = false
risk = "high"
references = [
  "spec - docs/spec/engine/rpgcode-modules-and-objects.md (OOP-11)",
  "adr - docs/adr/0004-script-ast-step-ir-and-plugins.md, decision 8",
  "code - packages/core/src/script/values.ts (CallableValue), vm.ts, builtins/",
]

