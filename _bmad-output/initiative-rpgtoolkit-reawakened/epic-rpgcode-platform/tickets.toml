# tickets.toml — planned entries of epic-rpgcode-platform, in build order. tickets.py reads it.
# Table order is the build order; ids are stable names. Entry 1 is an owner-approval docs checkpoint (pending); entry 2 is an early owner-read spike.
# Lanes: A objects (3, 4, 5, then 13), B packages (6, 7, 8), C main-file list (9), D events (10, 11, 12). 10 owns the events section; 15 reconciles shared barrels, the phase list and the GameState section list.
# Builds what Epic 18 recorded as not built: the object runtime, receiver binding and registerPlugin.

[[entry]]
id = 1
type = "story"
title = "Rulings: objects, receivers, packages, emitters and the trust baseline"
description = "Doc-first (G7), docs only: settles in docs/spec the dictionary/object runtime and receiver rules (OOP-10, OOP-11, `bindThis`), RPGCode packages on the single shared plugin manifest (name, version, namespace, declared host requests, AD-8 later-wins), `registerPlugin` as a thin layer over the 18.5 environment table, emitter semantics including cancelable emits, the plugin-language guidance and the trust baseline ADR, and records the AD-32 event-bus conflict."
verify = "The commit touches only docs and affected spec/ADR/spine text; every ruling row carries an OWNER marker, evidence and a rejected alternative; the 2026-10-19 owner decisions each map to one ruled row; ADR 0008 (trust baseline) exists; no later entry relies on unruled behaviour; a person approves the checkpoint."
covers = ["CAP-5", "CAP-11"]
after = ["18.7", "3.23", "3.25"]
hitl = true
risk = "high"
plan_checkpoint = true
done_checkpoint = true
references = [
  "spec - docs/spec/engine/rpgcode-modules-and-objects.md (MOD-4, OOP-10, OOP-11)",
  "spec - docs/spec/engine/rpgcode-language.md (FUN-8)",
  "spec - docs/spec/engine/plugins-and-battle.md#e-99",
  "adr - docs/adr/0004-script-ast-step-ir-and-plugins.md, decision 8",
  "spine - _bmad-output/initiative-rpgtoolkit-reawakened/architecture-rpgtoolkit-reawakened/architecture-rpgtoolkit-reawakened.md, AD-8, AD-10, AD-17, AD-26, AD-32",
  "party - _bmad-output/initiative-rpgtoolkit-reawakened/epic-rpgcode-platform/discovery/inception-proposal.md, table D",
]

[[entry]]
id = 2
type = "story"
title = "Spike: stock ATB tick and cancelable emits against STEP_BUDGET"
description = "Writes a throwaway-free, committed benchmark in pure RPGCode (authored from the E-72 to E-75 numbers) that runs a stock ATB tick for four fighters with statuses ticking and events per hit, plus a cancelable-emit model (parked thread, N listeners in order, event mutation), and measures VM steps per tick against `STEP_BUDGET` (1000) and the 19.1 emitter rules."
verify = "A written result in discovery/ reports steps per tick for 4 fighters x {0,1,3} statuses x {0,1,4,8} events per hit and for a cancelable emit with {1,4,8} listeners, states whether the worst realistic case fits in `STEP_BUDGET` and, if not, the specific changes it forces on Epic 20 and the emitter design; the benchmark is a committed test with a seeded RNG and a pinned state hash; a person reads the result before 19.10 and 20.1 start."
covers = ["CAP-5", "CAP-9"]
after = [1, "18.5", "18.6"]
hitl = true
risk = "high"
plan_checkpoint = true
done_checkpoint = true
references = [
  "spec - docs/spec/engine/plugins-and-battle.md#e-72 to E-75",
  "spec - docs/spec/engine/rpgcode-errors-and-threads.md (THR-3, the budget)",
  "code - packages/core/src/script/vm.ts (STEP_BUDGET)",
  "code - packages/core/src/engine/engine.ts (runThreadsPhase)",
  "data - docs/spec/examples/game/ (character and enemy examples for the fighter values)",
]

