name: "Bug Report"
description: "Report a bug or a deviation from docs/spec."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide commands, code snippet, or steps to reproduce the issue.
      placeholder: |
        1. Run `node --test ...`
        2. With input ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead according to `docs/spec/`?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version, OS, pnpm version.
      placeholder: Node 24.21.0, macOS / Ubuntu / Windows, pnpm 12.10.1
    validations:
      required: false
